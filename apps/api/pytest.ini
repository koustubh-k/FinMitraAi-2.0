[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests

# Auto-discover tests matching these file names
python_files = test_*.py *_test.py

# CLI flags applied automatically on every run:
# -v : Verbose output (lists each test name and pass/fail state)
# -s : Disables output capturing (lets print statements display in console)
# --strict-markers : Prevents typos in custom test markers
addopts = -v --strict-markers

# Suppress harmless third-party deprecation warnings from polluting the test output
filterwarnings =
    ignore::DeprecationWarning
