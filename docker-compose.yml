services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finmitra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finmitra_password}
      POSTGRES_DB: ${POSTGRES_DB:-finmitra_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finmitra_user} -d ${POSTGRES_DB:-finmitra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finmitra_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
