name: CI Pipeline

on:
  push:
    branches: [ main, "phase/*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint and Format
        run: |
          ruff check .
          ruff format --check .

      - name: Run Backend Tests
        run: |
          # Changed from tests/unit/ to tests/ to match your repository layout
          pytest -v tests/

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          # Points to the lockfile, which setup-node requires for hashing
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # Uses clean install from lockfile rather than mutating installs
        run: npm ci

      - name: Run Next.js Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
